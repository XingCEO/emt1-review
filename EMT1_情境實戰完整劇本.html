<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMT-1 考場實戰流程播放器｜一動一頁免滑動</title>
<style>
  :root {
    --bg: #090d16;
    --card: #121a2d;
    --line: #223254;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --faint: #64748b;
    --ohca: #fbbf24;
    --trauma: #f43f5e;
    --med: #38bdf8;
    --ok: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* Top Navigation Bar */
  header.top-bar {
    background: #0c1322; border-bottom: 1px solid var(--line);
    padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 100;
  }
  .brand-area { display: flex; align-items: baseline; gap: 12px; }
  .brand-area h1 { font-size: 1.25rem; font-weight: 900; color: #fff; }
  .brand-area span { font-size: .85rem; color: var(--muted); }

  .view-toggle {
    display: flex; background: rgba(0,0,0,.35); padding: 3px; border-radius: 10px;
    border: 1px solid var(--line); gap: 4px;
  }
  .view-btn {
    padding: 5px 12px; border-radius: 7px; font-size: .82rem; font-weight: 700;
    border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .view-btn.active { background: #38bdf8; color: #082f49; }

  /* Scenario Pills Carousel */
  .sc-bar {
    background: #0f182c; border-bottom: 1px solid var(--line);
    padding: 8px 14px; display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: thin; white-space: nowrap;
  }
  .sc-tab {
    padding: 6px 14px; border-radius: 99px; font-size: .86rem; font-weight: 700;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--muted);
    cursor: pointer; transition: all .14s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .sc-tab:hover { background: rgba(255,255,255,.08); color: #fff; }
  .sc-tab.active { background: #38bdf8; color: #082f49; border-color: #38bdf8; }
  .sc-tab.active.tab-ohca { background: var(--ohca); color: #451a03; border-color: var(--ohca); }
  .sc-tab.active.tab-trauma { background: var(--trauma); color: #fff; border-color: var(--trauma); }

  /* Stage Container */
  main.stage {
    flex: 1; max-width: 960px; width: 100%; margin: 0 auto;
    padding: 20px 20px 40px; display: flex; flex-direction: column;
  }

  /* Stepper Progress Bar */
  .progress-wrap {
    margin-bottom: 16px;
  }
  .progress-meta {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .progress-meta .scene-badge {
    font-size: .95rem; font-weight: 900; display: flex; align-items: center; gap: 8px; color: #fff;
  }
  .progress-meta .step-counter {
    font-size: .9rem; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums;
  }
  .step-bar {
    display: flex; gap: 4px; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.08);
  }
  .step-bar i {
    flex: 1; background: transparent; transition: background .2s ease;
  }
  .step-bar i.done { background: #34d399; }
  .step-bar i.current { background: #38bdf8; }

  /* Player Card (No scroll viewport) */
  .player-card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 24px 28px; box-shadow: 0 15px 40px rgba(0,0,0,.4); display: flex;
    flex-direction: column; gap: 18px; min-height: 480px; justify-content: space-between;
  }

  .step-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .step-title-group h2 { font-size: 1.35rem; font-weight: 900; color: #fff; line-height: 1.3; }
  .step-phase-tag {
    font-size: .75rem; font-weight: 800; padding: 2px 8px; border-radius: 6px;
    background: rgba(56,189,248,.15); color: #7dd3fc; text-transform: uppercase;
  }

  /* Big Spoken Line Box */
  .speech-box {
    background: rgba(56, 189, 248, 0.1); border: 2px solid rgba(56, 189, 248, 0.4);
    border-radius: 16px; padding: 18px 22px; position: relative;
  }
  .speech-label {
    font-size: .76rem; font-weight: 900; color: #38bdf8; text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .speech-text {
    font-size: 1.4rem; font-weight: 900; color: #fff; line-height: 1.45; letter-spacing: .02em;
  }

  /* Action Details Grid */
  .action-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .info-cell {
    background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px; padding: 12px 16px; font-size: .92rem;
  }
  .info-cell.examiner-cell {
    background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.25);
  }
  .info-cell.partner-cell {
    background: rgba(52,211,153,.06); border-color: rgba(52,211,153,.25);
  }
  .info-cell.trap-cell {
    background: rgba(244,63,94,.06); border-color: rgba(244,63,94,.25); color: #fecdd3;
  }
  .info-tag {
    font-size: .75rem; font-weight: 800; display: block; margin-bottom: 4px;
    text-transform: uppercase;
  }
  .tag-act { color: #94a3b8; }
  .tag-exam { color: var(--ohca); }
  .tag-part { color: var(--ok); }
  .tag-trap { color: #fb7185; }

  /* Player Bottom Controls */
  .ctrl-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.07); flex-wrap: wrap;
  }
  .btn-nav {
    padding: 12px 24px; border-radius: 12px; font-size: 1.05rem; font-weight: 800;
    cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px;
    transition: all .15s ease;
  }
  .btn-prev { background: rgba(255,255,255,.08); color: #fff; }
  .btn-prev:hover:not(:disabled) { background: rgba(255,255,255,.14); transform: translateX(-2px); }
  .btn-next { background: #38bdf8; color: #082f49; }
  .btn-next:hover:not(:disabled) { background: #7dd3fc; transform: translateX(2px); box-shadow: 0 4px 16px rgba(56,189,248,.35); }
  .btn-nav:disabled { opacity: .3; cursor: not-allowed; transform: none; }
  .btn-voice {
    background: rgba(251,191,36,.12); color: var(--ohca); border: 1px solid rgba(251,191,36,.3);
    padding: 10px 16px; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer;
  }
  .btn-voice:hover { background: rgba(251,191,36,.22); }

  /* Full List Mode (Alternative View) */
  #view-list { display: none; flex-direction: column; gap: 16px; }
  .list-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px;
  }
  .list-card h3 { font-size: 1.15rem; color: #38bdf8; margin-bottom: 8px; }

  @media (max-width: 600px) {
    .speech-text { font-size: 1.15rem; }
    .player-card { padding: 18px 16px; min-height: 440px; }
    .btn-nav { padding: 10px 16px; font-size: .95rem; }
  }
</style>
</head>

// Render Scenario Tabs
function renderTabs() {
  scBar.innerHTML = DATABASE.map((sc, i) => `
    <button class="sc-tab ${i === activeSceneIdx ? 'active' : ''} ${sc.type === 'ohca' ? 'tab-ohca' : sc.type === 'trauma' ? 'tab-trauma' : ''}" data-sc-idx="${i}">
      ${sc.name}
    </button>
  `).join("");

  scBar.querySelectorAll(".sc-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      activeSceneIdx = parseInt(tab.dataset.scIdx, 10);
      activeStepIdx = 0;
      renderTabs();
      renderScene();
    });
  });
}

// Render Step in Player Mode (一動一頁免滑動)
function renderPlayer() {
  const sc = DATABASE[activeSceneIdx];
  const step = sc.steps[activeStepIdx];
  const total = sc.steps.length;

  document.querySelector("#scene-badge").innerHTML = `
    <span style="color:${sc.type === 'ohca' ? 'var(--ohca)' : sc.type === 'trauma' ? 'var(--trauma)' : 'var(--med)'}">●</span>
    ${sc.name}
    <span style="font-size:.8rem; font-weight:normal; color:var(--faint);">(${sc.tag})</span>
  `;

  document.querySelector("#step-counter").textContent = `步驟 ${activeStepIdx + 1} / 共 ${total} 步`;

  // Step Bar
  const stepBar = document.querySelector("#step-bar");
  stepBar.innerHTML = sc.steps.map((s, i) => `
    <i class="${i < activeStepIdx ? 'done' : i === activeStepIdx ? 'current' : ''}"></i>
  `).join("");

  // Card Content
  document.querySelector("#step-phase").textContent = step.phase;
  document.querySelector("#step-title").textContent = step.title;
  document.querySelector("#speech-text").textContent = step.say;

  // Grid details
  let gridHtml = `
    <div class="info-cell">
      <span class="info-tag tag-act">🛠️ 你的手部與肢體動作</span>
      <div>${step.act}</div>
    </div>
  `;

  if (step.partner) {
    gridHtml += `
      <div class="info-cell partner-cell">
        <span class="info-tag tag-part">👥 副手配合動作</span>
        <div>${step.partner}</div>
      </div>
    `;
  }

  if (step.exam) {
    gridHtml += `
      <div class="info-cell examiner-cell">
        <span class="info-tag tag-exam">👨‍🏫 考官出題與反應</span>
        <div style="white-space:pre-line;">${step.exam}</div>
      </div>
    `;
  }

  if (step.trap) {
    gridHtml += `
      <div class="info-cell trap-cell">
        <span class="info-tag tag-trap">⚠️ 考場大忌（踩中扣分）</span>
        <div>${step.trap}</div>
      </div>
    `;
  }

  if (step.phase.includes("階段四") || step.title.includes("危急")) {
    gridHtml += `
      <div class="info-cell finish-cell" style="background:rgba(16,185,129,0.18); border:2px solid #10b981; grid-column:1/-1; border-radius:10px; padding:14px;">
        <span class="info-tag" style="color:#34d399; font-weight:900; font-size:0.85rem;">🛑 現場考場終點站・滿分結案！</span>
        <div style="color:#e2e8f0; font-size:1.02rem; font-weight:800; margin-top:4px;">
          👉 主手大聲向考官報告：「本案判定為危急個案，立即請求支援並後送！」考官點頭喊停，現場技術考試到此滿分過關！【免搬長背板！免上擔架床！】
        </div>
      </div>
    `;
  } else if (step.phase.includes("階段五")) {
    gridHtml += `
      <div class="info-cell truck-cell" style="background:rgba(168,85,247,0.15); border:1px solid #a855f7; grid-column:1/-1; border-radius:10px; padding:12px;">
        <span class="info-tag" style="color:#c084fc; font-weight:800; font-size:0.85rem;">🚑 救護車上處置（口試抽問／無線電回報）</span>
        <div style="color:#cbd5e1; font-size:0.88rem; margin-top:2px;">
          在車上每 5 分鐘重測生命徵象與身體檢查，並使用「病人要史已前到」向醫院急診室無線電回報。
        </div>
      </div>
    `;
  }

  document.querySelector("#action-grid").innerHTML = gridHtml;

  // Nav buttons
  const btnPrev = document.querySelector("#btn-prev");
  const btnNext = document.querySelector("#btn-next");
  btnPrev.disabled = (activeStepIdx === 0);
  btnNext.textContent = (activeStepIdx === total - 1) ? "🏁 本題結束！點此換下一情境 ➔" : "下一步 ➔ (鍵盤 → 或 Space)";
}

// Render Full List Mode (一頁全覽)
function renderList() {
  const sc = DATABASE[activeSceneIdx];
  viewList.innerHTML = `
    <div style="margin-bottom:14px;">
      <h2 style="font-size:1.4rem; color:#fff;">${sc.name} <span style="font-size:.9rem; color:var(--muted); font-weight:normal;">(${sc.tag})</span></h2>
    </div>
    ${sc.steps.map((step, i) => `
      <div class="list-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:.8rem; font-weight:900; color:var(--faint);">STEP ${i + 1} / ${sc.steps.length}</span>
          <span style="font-size:.8rem; font-weight:bold; color:#7dd3fc; background:rgba(56,189,248,.12); padding:2px 8px; border-radius:6px;">${step.phase}</span>
        </div>
        <h3 style="margin:4px 0 10px; color:#fff;">${step.title}</h3>
        <div style="background:rgba(56,189,248,.1); border-left:3px solid #38bdf8; padding:10px 14px; border-radius:0 8px 8px 0; margin-bottom:10px;">
          <b style="color:#7dd3fc; font-size:.85rem;">🗣️ 標準口令：</b>
          <div style="font-size:1.15rem; font-weight:800; color:#fff; margin-top:4px;">${step.say}</div>
        </div>
        <div style="font-size:.9rem; color:var(--muted); margin-bottom:6px;"><b>🛠️ 動作：</b>${step.act}</div>
        ${step.exam ? `<div style="font-size:.9rem; color:var(--ohca); margin-bottom:6px;"><b>👨‍🏫 考官反應：</b>${step.exam}</div>` : ''}
        ${step.trap ? `<div style="font-size:.88rem; color:#fecdd3; background:rgba(244,63,94,.1); padding:6px 10px; border-radius:6px; margin-top:8px;"><b>⚠️ 考場紅線：</b>${step.trap}</div>` : ''}
      </div>
    `).join("")}
  `;
}

function renderScene() {
  if (isListMode) {
    viewPlayer.style.display = "none";
    viewList.style.display = "flex";
    renderList();
  } else {
    viewPlayer.style.display = "block";
    viewList.style.display = "none";
    renderPlayer();
  }
}

// Next & Prev actions
function goNext() {
  const sc = DATABASE[activeSceneIdx];
  if (activeStepIdx < sc.steps.length - 1) {
    activeStepIdx++;
    renderPlayer();
  } else {
    // Switch to next scenario
    activeSceneIdx = (activeSceneIdx + 1) % DATABASE.length;
    activeStepIdx = 0;
    renderTabs();
    renderScene();
  }
}

function goPrev() {
  if (activeStepIdx > 0) {
    activeStepIdx--;
    renderPlayer();
  }
}

// Speech synthesis
function speakCurrent() {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const sc = DATABASE[activeSceneIdx];
    const text = sc.steps[activeStepIdx].say;
    const clean = text.replace(/[「」『』🗣️]/g, "");
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = "zh-TW";
    utter.rate = 1.05;
    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

// Event Listeners
document.querySelector("#btn-next").addEventListener("click", goNext);
document.querySelector("#btn-prev").addEventListener("click", goPrev);
document.querySelector("#btn-voice").addEventListener("click", speakCurrent);

// Toggle views
document.querySelector("#btn-mode-player").addEventListener("click", () => {
  isListMode = false;
  document.querySelector("#btn-mode-player").classList.add("active");
  document.querySelector("#btn-mode-list").classList.remove("active");
  renderScene();
});
document.querySelector("#btn-mode-list").addEventListener("click", () => {
  isListMode = true;
  document.querySelector("#btn-mode-list").classList.add("active");
  document.querySelector("#btn-mode-player").classList.remove("active");
  renderScene();
});

// Keyboard navigation (免滑動・鍵盤切換)
window.addEventListener("keydown", (e) => {
  if (isListMode) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
    e.preventDefault();
    goNext();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    goPrev();
  }
});

// Initialize
renderTabs();
renderScene();
</script>
</body>
</html>
