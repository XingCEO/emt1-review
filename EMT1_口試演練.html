<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMT-1 考前口試情境演練（旺英標準）</title>
<style>
  :root {
    --bg: #0b1120;
    --card: rgba(18, 28, 48, .92);
    --card-hover: rgba(26, 40, 68, .96);
    --line: rgba(148, 176, 214, .2);
    --line-light: rgba(148, 176, 214, .35);
    --text: #f8fafc;
    --muted: #cbd5e1;
    --faint: #94a3b8;
    --med: #38bdf8;
    --trauma: #f43f5e;
    --ohca: #fbbf24;
    --ok: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 8% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(760px 380px at 100% 0%, rgba(251,191,36,.14), transparent 48%),
      radial-gradient(520px 320px at 70% 110%, rgba(244,63,94,.1), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.65;
  }
  body::before {
    content: ""; display: block; height: 3px;
    background: linear-gradient(90deg, var(--med), var(--ohca) 55%, var(--trauma));
  }
  a { color: #7dd3fc; }
  button, header a {
    font: inherit; cursor: pointer; color: var(--text); text-decoration: none;
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; transition: all .16s ease;
  }
  button:hover, header a:hover {
    background: rgba(255,255,255,.1); border-color: rgba(186,230,253,.5);
    transform: translateY(-1px);
  }
  button.primary { background: var(--med); border-color: var(--med); color: #082f49; font-weight: 800; }
  button.primary:hover { background: #7dd3fc; }
  button.next { background: var(--ohca); border-color: var(--ohca); color: #451a03; font-weight: 800; }
  button.next:hover { background: #fde047; }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  :focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }

  header {
    max-width: 1080px; margin: 0 auto; padding: 22px 20px 0;
    display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap;
  }
  header > div:first-child { min-width: 0; flex: 1 1 320px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0; font-weight: 900; letter-spacing: .02em; }
  .subtitle { margin: 6px 0 0; color: var(--faint); font-size: .92rem; }
  .tag-rule {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: .8rem; font-weight: 700; background: rgba(251,191,36,.15);
    color: var(--ohca); border: 1px solid rgba(251,191,36,.3); margin-top: 6px;
  }

  main { max-width: 1080px; margin: 0 auto; padding: 18px 20px 64px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px; max-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .card h2 { margin-top: 0; font-size: 1.25rem; }

  /* Mode selection grid */
  .mode-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .mode-btn {
    text-align: left; border-radius: 16px; padding: 16px 18px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03);
    border-left: 4px solid var(--line); transition: all .16s ease;
  }
  .mode-btn:hover {
    background: var(--card-hover); border-color: var(--line-light);
    transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,.25);
  }
  .mode-btn.random { border-left-color: #ec4899; }
  .mode-btn.ohca { border-left-color: var(--ohca); }
  .mode-btn.trauma { border-left-color: var(--trauma); }
  .mode-btn.med { border-left-color: var(--med); }
  .mode-btn.skills { border-left-color: var(--ok); }
  .mode-btn.weak { border-left-color: #a855f7; }
  .mode-btn b { display: flex; align-items: center; justify-content: space-between; font-size: 1.1rem; color: #fff; }
  .mode-btn span { display: block; color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .badge-mini {
    font-size: .72rem; padding: 2px 7px; border-radius: 999px;
    font-weight: 700; letter-spacing: .05em;
  }
  .bg-pink { background: rgba(236,72,153,.2); color: #f472b6; border: 1px solid rgba(236,72,153,.3); }
  .bg-ohca { background: rgba(251,191,36,.2); color: var(--ohca); border: 1px solid rgba(251,191,36,.3); }
  .bg-trauma { background: rgba(244,63,94,.2); color: #fb7185; border: 1px solid rgba(244,63,94,.3); }
  .bg-med { background: rgba(56,189,248,.2); color: #7dd3fc; border: 1px solid rgba(56,189,248,.3); }
  .bg-skill { background: rgba(52,211,153,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.3); }

  /* 11 Scenarios Grid */
  .section-title {
    margin: 28px 0 12px; display: flex; align-items: center; justify-content: space-between;
    font-size: 1.15rem; font-weight: 800; color: var(--text); letter-spacing: .03em;
  }
  .section-title span { font-size: .86rem; font-weight: normal; color: var(--faint); }
  .scenes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px;
  }
  .scene-card {
    border-radius: 14px; padding: 12px 14px; text-align: left;
    background: rgba(15, 23, 42, .6); border: 1px solid var(--line);
    transition: all .14s ease; display: flex; flex-direction: column; justify-content: space-between;
  }
  .scene-card:hover {
    background: rgba(30, 41, 59, .85); border-color: rgba(148,176,214,.4);
    transform: translateY(-2px);
  }
  .scene-card.trauma-border { border-left: 3px solid var(--trauma); }
  .scene-card.med-border { border-left: 3px solid var(--med); }
  .scene-top { display: flex; justify-content: space-between; align-items: center; }
  .scene-num { font-size: .75rem; color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }
  .scene-name { font-size: 1rem; font-weight: 800; margin: 4px 0 2px; color: #fff; }
  .scene-hint { font-size: .8rem; color: var(--muted); line-height: 1.4; }

  /* Ask View */
  .run-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .run-head strong { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .step {
    font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: rgba(0,0,0,.25);
  }
  .bar { height: 5px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 12px 0 0; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--med), var(--ohca)); width: 0; transition: width .25s ease; }
  .prompt {
    margin-top: 16px; padding: 18px 20px; border-radius: 16px;
    background: rgba(6, 12, 24, .65); border: 1px solid rgba(251,191,36,.25);
  }
  .who { color: var(--ohca); font-size: .8rem; font-weight: 800; letter-spacing: .12em; margin: 0; text-transform: uppercase; }
  .exam { font-size: 1.55rem; font-weight: 800; line-height: 1.45; margin: 6px 0 0; color: #fff; }
  label { display: block; margin: 16px 0 8px; color: var(--faint); font-size: .92rem; font-weight: 600; }
  textarea {
    width: 100%; min-height: 80px; resize: vertical; border-radius: 14px;
    border: 1px solid var(--line); background: rgba(6,12,24,.55); color: var(--text);
    font: inherit; font-size: 1.15rem; line-height: 1.5; padding: 14px 16px;
  }
  textarea:focus { outline: none; border-color: var(--med); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  textarea::placeholder { color: #64748b; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .feedback { margin-top: 16px; border-radius: 14px; padding: 16px 18px; }
  .feedback.good { background: rgba(52,211,153,.12); color: var(--ok); border: 1px solid rgba(52,211,153,.3); }
  .feedback.bad { background: rgba(244,63,94,.1); color: #fca5a5; border: 1px solid rgba(244,63,94,.3); }
  .model { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--ohca); background: rgba(0,0,0,.25); border-radius: 0 8px 8px 0; color: var(--text); }
  .log { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .log div { font-size: .88rem; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .log b { font-weight: 800; }
  .mark-ok { color: var(--ok); }
  .mark-mid { color: var(--ohca); }
  .mark-bad { color: var(--bad); }
  .met { font-variant-numeric: tabular-nums; color: var(--ohca); font-weight: 700; align-self: center; margin-left: 6px; }

  /* 選擇題模式 (四選一極速狂刷) */
  .mc-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px; margin: 16px 0;
  }
  .mc-option {
    display: flex; align-items: flex-start; gap: 12px; text-align: left;
    padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--text); font-size: 1.05rem;
    line-height: 1.45; cursor: pointer; transition: all .14s ease; width: 100%;
  }
  .mc-option:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.08); border-color: #38bdf8;
    transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .mc-option .mc-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px; font-weight: 900;
    font-size: .92rem; background: rgba(255,255,255,.08); color: var(--muted);
    flex-shrink: 0;
  }
  .mc-option.correct {
    background: rgba(52, 211, 153, 0.18) !important;
    border-color: #34d399 !important; color: #a7f3d0 !important;
  }
  .mc-option.correct .mc-badge {
    background: #34d399 !important; color: #064e3b !important;
  }
  .mc-option.wrong {
    background: rgba(244, 63, 94, 0.18) !important;
    border-color: #f43f5e !important; color: #fecdd3 !important;
  }
  .mc-option.wrong .mc-badge {
    background: #f43f5e !important; color: #ffe4e6 !important;
  }
  .toggle-bar {
    display: inline-flex; background: rgba(0,0,0,.35); padding: 4px; border-radius: 12px;
    border: 1px solid var(--line); gap: 4px;
  }
  .toggle-btn {
    padding: 6px 14px; border-radius: 8px; font-size: .88rem; font-weight: 700;
    border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .toggle-btn.active {
    background: #38bdf8; color: #082f49; box-shadow: 0 2px 8px rgba(56,189,248,.3);
  }

  @media (max-width: 800px) {
    header { padding-top: 16px; }
    .exam { font-size: 1.3rem; }
    main { padding: 14px 14px 60px; }
    .card { padding: 16px; border-radius: 16px; }
    .scenes-grid { grid-template-columns: 1fr; }
    .mc-option { font-size: .96rem; padding: 12px 14px; }
  }
</style>
</head>

<script>
const STORE = "emt-oral-v2";

const N = (label, any, extra) => ({ label, any, ...(extra || {}) });

function q(id, examiner, label, words, hint, model, ban) {
  const turn = { id, examiner, need: [N(label, words)], hint, model };
  if (ban) turn.forbid = [N(ban[0], ban[1])];
  return turn;
}

/* ========================================================
   1. OHCA 流程測驗（獨立必考大站，滿分 25 分，須達 19 分）
======================================================== */
const OHCA = {
  id: "ohca",
  title: "OHCA 流程測驗（必考 25 分）",
  tag: "ohca",
  blurb: "大廳 50 歲男性倒地。從進場、叫拍捏、呼吸脈搏、按壓吹氣到兩次 AED 分析完整過關。",
  turns: [
    q("ohca-safe", "50 歲男性昏倒在大廳。你進場，第一句喊什麼？", "現場安全", ["不安全", "安全", "沒危險", "沒有危險", "有危險"], "先看環境安全。", "現場環境安全。"),
    q("ohca-ppe", "現場安全。你自己做好什麼防護？", "個人防護", ["手套", "口罩", "防護", "裝備"], "防護裝備：手套、口罩。", "戴手套、戴口罩做好自我防護。"),
    q("ohca-num", "現場有幾位傷患，接著做什麼？", "人數與求援", ["人數", "一位", "求援", "119", "支援", "副手", "開急救包"], "詢問傷患人數，請副手呼叫 119 求援並開急救包。", "請問有幾位傷患？請副手打 119 求援、開急救包。"),
    q("ohca-voice", "走到患者身旁，意識評估第一步？", "叫先生", ["先生", "叫", "呼喚", "哈囉", "小姐"], "先叫先生先生。", "先生先生你還好嗎？"),
    q("ohca-tap", "叫了沒反應，意識評估第二步？", "拍肩膀", ["拍肩", "拍雙肩", "雙肩", "肩膀"], "輕拍兩側肩膀。", "輕拍患者雙肩：先生先生！"),
    q("ohca-pain", "拍了還是沒反應，意識評估第三步？", "疼痛刺激", ["斜方", "捏", "掐", "痛"], "捏斜方肌給予疼痛刺激。", "捏斜方肌給予疼痛刺激。"),
    q("ohca-air", "完全沒反應，患者無外傷機轉。呼吸道如何打開？", "壓額抬頦", ["壓額", "抬頦", "抬下巴", "後仰", "仰頭"], "無外傷頸椎疑慮，採壓額抬頦法。", "採壓額抬頦法暢通呼吸道。", ["創傷才用下顎推擠", ["下顎", "推擠"]]),
    q("ohca-check", "打開呼吸道後，檢查呼吸與脈搏怎麼做？", "同時看呼吸摸頸動脈", ["看胸", "呼吸", "摸頸動", "頸動脈", "10秒", "十秒"], "看胸部有無起伏，同時摸頸動脈，不超過 10 秒。", "眼睛看胸部起伏，同時手摸頸動脈，評估不超過 10 秒。"),
    q("ohca-state", "考官說：無正常呼吸，摸不到頸動脈！你下一句下什麼指令？", "副手備甦醒球與AED開始CPR", ["cpr", "按壓", "壓胸", "aed", "bvm", "甦醒球"], "報告考官：無正常呼吸、無脈搏！請副手準備甦醒球、拿 AED，我開始按壓 CPR！", "無呼吸無脈搏！請副手準備甦醒球與 AED，我立即開始按壓 CPR！"),
    q("ohca-rate", "考官問：你的胸外按壓頻率與深度標準是多少？", "100到120深度5到6", ["100", "120", "5", "6", "公分", "cm"], "按壓頻率每分鐘 100-120 下，深度 5-6 公分，且胸壁完全回彈。", "頻率每分鐘 100-120 下，深度 5-6 公分，胸壁完全回彈。"),
    q("ohca-ratio", "按壓與吹氣（甦醒球）的比例是多少？", "30比2", ["30", "三十", "兩口", "2口", "兩氣", "兩次", "2次", "30比2"], "高品質按壓 30 下，配 2 口氣（以 E-C 夾緊吹氣，每口約 1 秒看胸部起伏）。", "30 比 2，吹氣時看胸部起伏。"),
    q("ohca-aed-in", "副手攜帶 AED 抵達，副手的第一個動作是什麼？", "開啟電源", ["開機", "電源", "按開關", "打開電源", "綠色"], "AED 到了：開、貼、電、壓！第一步永遠是先開機。", "打開 AED 電源開關。"),
    q("ohca-pads", "AED 開機後，副手接著做什麼？", "貼上電極貼片", ["貼片", "電極片", "黏貼片"], "貼片貼在右胸鎖骨下、左乳頭外下側，並將導線插頭插好。", "依圖示貼上電極貼片並連接插頭。"),
    q("ohca-analyze", "AED 語音提示：「正在分析心律，請勿接觸病患。」這時主副手喊什麼？", "清場不要碰病患", ["清場", "離開", "不要碰", "大家離開", "我離開你離開大家離開"], "主副手雙手離開舉起，大聲喊：「我離開、你離開、大家離開！」", "雙手舉起喊：我離開、你離開、大家離開！不要碰觸病患！"),
    q("ohca-shock", "AED 語音提示：「建議電擊，正在充電。」充電完畢後按電擊前要喊什麼？", "確認所有人離開按下電擊", ["離開", "電擊", "放電", "閃開", "按電擊"], "再次確認所有人離開，大聲喊：「大家離開！」確認沒人碰觸後按下電擊鈕。", "確認所有人離開喊大家離開，按下電擊鈕！"),
    q("ohca-post-shock", "電擊放電完成！你的雙手下一個動作是什麼？", "立刻繼續CPR按壓", ["立刻按壓", "馬上按壓", "繼續按壓", "cpr", "壓胸", "繼續壓"], "電擊完成後完全不用摸脈搏，雙手立刻放上胸骨繼續按壓 CPR！", "電擊完成後不摸脈搏，立刻繼續按壓 CPR！"),
    q("ohca-no-shock-1", "情境切換：第一次分析心律，AED 語音提示「不建議電擊」，你要摸脈搏嗎？", "不摸脈搏立刻繼續CPR", ["不摸", "不用摸", "不要摸", "立刻壓", "繼續壓", "按壓", "cpr"], "第一次不建議電擊：完全不用摸脈搏，立刻繼續壓胸 CPR！", "不用摸脈搏，立刻繼續按壓 CPR！", ["第一次不摸脈", ["摸頸", "摸脈"]]),
    {
      id: "ohca-second-analysis",

/* 評分與文字正規化 */
const NEG_PREFIXES = ["不可以", "不能用", "還沒到", "還沒有", "不能", "不要", "不是", "尚未", "不用", "不必", "不算", "不可", "不該", "沒有", "禁止", "而非", "並非", "還沒", "別", "勿", "不", "非", "嚴禁", "免用", "免"];
const CN_NUM = "零一二三四五六七八九十百千兩";
function cnNum(ch) { return !!ch && CN_NUM.includes(ch); }

function norm(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
    .replace(/一一九/g, "119")
    .replace(/([0-9零一二三四五六七八九十百千兩])\s*[:：/／|｜\-－–—]\s*([0-9零一二三四五六七八九十百千兩])/g, "$1比$2")
    .replace(/\s+/g, "")
    .replace(/[，。、；：！？,.!?:;'"「」『』（）()\-—／/|｜]/g, "");
}

function negatedBefore(text, index) {
  let at = index;
  while (at > 0 && "再用給去把".includes(text[at - 1])) at -= 1;
  if (NEG_PREFIXES.some((prefix) => at >= prefix.length && text.slice(at - prefix.length, at) === prefix)) {
    return true;
  }
  // 複合詞跳讀（例如：嚴禁壓額抬頦、不可抬頦後仰，否定詞直接作用於整個動詞組）
  const skip = "再用給去把進做採使用壓額抬頦仰頭後仰";
  at = index;
  let steps = 0;
  while (at > 0 && steps < 6 && skip.includes(text[at - 1])) {
    at -= 1;
    steps += 1;
    if (NEG_PREFIXES.some((prefix) => at >= prefix.length && text.slice(at - prefix.length, at) === prefix)) {
      return true;
    }
  }
  return false;
}

function hit(text, term) {
  const needle = norm(term);
  if (!needle) return false;
  const startsDigit = /[0-9]/.test(needle[0]);
  const endsDigit = /[0-9]/.test(needle[needle.length - 1]);
  let from = 0;
  while (from < text.length) {
    const at = text.indexOf(needle, from);
    if (at < 0) return false;
    const before = at > 0 ? text[at - 1] : "";
    const after = text[at + needle.length] || "";
    if ((startsDigit && /[0-9]/.test(before)) || (endsDigit && /[0-9]/.test(after))) {
      from = at + 1;
      continue;
    }
    if ((cnNum(needle[0]) && cnNum(before)) || (cnNum(needle[needle.length - 1]) && cnNum(after))) {
      from = at + 1;
      continue;
    }
    if (negatedBefore(text, at)) {
      from = at + needle.length;
      continue;
    }
    return true;
  }
  return false;
}

function groupHit(text, group) {
  return group.any.some((term) => hit(text, term));
}

function grade(answer, turn) {
  const text = norm(answer);
  if (!text) return { empty: true, pass: false, missing: turn.need || [], forbidden: [] };
  const forbidden = (turn.forbid || []).filter((group) => groupHit(text, group));
  const missing = (turn.need || []).filter((group) => !groupHit(text, group));
  return { empty: false, pass: forbidden.length === 0 && missing.length === 0, missing, forbidden };
}

function resolveTurn(turn) {
  if (!turn.variants) return turn;
  const pick = turn.variants[Math.floor(Math.random() * turn.variants.length)];
  return { ...turn, ...pick, variants: undefined };
}

function getTurnChoices(turn) {
  if (turn.mcChoices) return turn.mcChoices;
  const correct = turn.model;
  const choices = [correct];
  
  if (turn.forbid && turn.forbid[0]) {
    const banWords = turn.forbid[0].any || [];
    const banChoice = EXTRA_DISTRACTORS.find(p => p !== correct && banWords.some(w => p.includes(w)));
    if (banChoice && !choices.includes(banChoice)) choices.push(banChoice);
  }
  
  const pool = [...EXTRA_DISTRACTORS].filter(p => p && p !== correct && !choices.includes(p));
  pool.sort(() => Math.random() - 0.5);
  for (const item of pool) {
    if (choices.length >= 4) break;
    if (!choices.includes(item)) choices.push(item);
  }
  turn.mcChoices = choices.sort(() => Math.random() - 0.5);
  return turn.mcChoices;
}

function selectChoice(index) {
  if (state.feedback && state.feedback.done) return;
  const turn = current();
  const choices = getTurnChoices(turn);
  const selected = choices[index];
  const isCorrect = (selected === turn.model);
  
  if (isCorrect) {
    record(turn, "standard");
    state.feedback = {
      kind: "good",
      text: "✅ 標準！答中考場核心處置，考官不扣分！",
      model: turn.model,
      selectedIdx: index,
      correctIdx: index,
      done: true
    };
    speak(turn.model);
  } else {
    record(turn, "wrong");
    const correctIdx = choices.indexOf(turn.model);
    state.feedback = {
      kind: "bad",
      text: "❌ 答錯（考場視為錯誤扣 2 分）。正確標準處置為：",
      model: turn.model,
      selectedIdx: index,
      correctIdx: correctIdx,
      done: true
    };
  }
  render();
}

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-TW";
    utter.rate = 1.05;
    window.speechSynthesis.speak(utter);
  } catch (err) { }
}

function current() { return state.turns[state.index]; }

function startTurns(turns, title, type, chainLeft) {
  state.turns = turns.map(resolveTurn);
  state.title = title;
  state.type = type || "";
  state.index = 0;
  state.attempt = 1;
  state.results = [];
  state.feedback = null;
  state.chainLeft = chainLeft || [];
  state.screen = "ask";
  render();
  const turn = current();
  if (turn) speak(turn.examiner);
}

function startRun(run, chainLeft) {
  startTurns(run.turns, run.title, run.type, chainLeft);
}

/* 考場隨機盲抽 1 題情境（1/11） */
function startRandomOne() {
  const pool = [...SCENES];
  const pick = pool[Math.floor(Math.random() * pool.length)];
  startRun(pick, []);
}

function startWeak() {
  const data = loadStore();
  const ids = Object.keys(data.miss).filter((id) => data.miss[id] > 0);
  const turns = [];
  RUNS.forEach((run) => {
    run.turns.forEach((turn) => {
      if (turn.variants) {
        turn.variants.forEach((variant) => {
          if (ids.includes(variant.id)) turns.push({ ...turn, ...variant, variants: undefined });
        });
      } else if (ids.includes(turn.id)) turns.push(turn);
    });
  });
  if (!turns.length) {
    state.screen = "home";
    state.notice = "目前沒有卡住的題目！先做一套情境，答錯的會自動記錄在這裡。";
    render();
    return;
  }
  startTurns(turns, "上次卡住的錯題", "弱點", []);
}

function record(turn, mark) {
  state.results.push({ id: turn.id, mark, label: turn.model });
  const data = loadStore();
  if (mark === "standard") data.miss[turn.id] = 0;
  else data.miss[turn.id] = (data.miss[turn.id] || 0) + 1;
  saveStore(data);
}

function submit() {
  const turn = current();
  const input = document.querySelector("#answer");
  const answer = input ? input.value : "";
  const result = grade(answer, turn);
  if (result.empty) {
    state.feedback = { kind: "bad", text: "請先回答一句再送出！空白不算扣分。" };
    render();
    return;
  }
  if (result.pass && state.attempt === 1 && !state.feedback?.hinted) {
    record(turn, "standard");
    state.feedback = { kind: "good", text: "✅ 標準！第一遍就講到核心重點，考官不扣分！", done: true };
    render();
    return;
  }
  if (result.pass) {
    record(turn, "prompt");
    state.feedback = { kind: "good", text: "⚠️ 本次答對（經提示後完成，考場視為不標準扣 1 分）。", done: true };
    render();
    return;
  }
  const lack = result.missing.map((item) => item.label).concat(result.forbidden.map((item) => item.label));
  if (state.attempt === 1) {
    state.attempt = 2;
    state.feedback = { kind: "bad", text: "❌ 核心要點尚未命中。換個說法再試一次，意思到了就給過！", lack };
    render();
    return;
  }
  record(turn, "wrong");
  state.feedback = { kind: "bad", text: "❌ 未能正確作答（考場視為錯誤扣 2 分）。請記住標準口令：", model: turn.model, done: true };
  render();
}

function showHint() {
  const turn = current();
  state.feedback = { kind: "bad", text: "💡 提示：" + turn.hint, hinted: true, lack: state.feedback?.lack };

}

function showModel() {
  const turn = current();
  if (!state.results.some((item) => item.id === turn.id)) record(turn, "wrong");
  state.feedback = { kind: "bad", text: "📖 考場標準講法示範：", model: turn.model, done: true };
  render();
}

function next() {
  if (state.index < state.turns.length - 1) {
    state.index += 1;
    state.attempt = 1;
    state.feedback = null;
    state.screen = "ask";
    render();
    speak(current().examiner);
    return;
  }
  if (state.chainLeft.length) {
    const run = state.chainLeft.shift();
    const kept = state.results.slice();
    startRun(run, state.chainLeft);
    state.results = kept;
    render();
    return;
  }
  state.screen = "done";
  state.feedback = null;
  render();
}

  const box = document.querySelector("#answer");
  if (!Rec) {
    state.feedback = { kind: "bad", text: "目前瀏覽器未支援語音輸入，請直接打字。以本機網址 (localhost/127.0.0.1) 開啟能啟用麥克風。" };
    render();
    return;
  }
  if (!recognition) {
    recognition = new Rec();
    recognition.lang = "zh-TW";
    recognition.interimResults = false;
  }
  recognition.onresult = (event) => {
    const said = event.results[0][0].transcript;
    const target = document.querySelector("#answer");
    if (target) target.value = (target.value ? target.value + " " : "") + said;
  };
  recognition.onerror = () => {
    state.feedback = { kind: "bad", text: "麥克風收音失敗，請直接鍵盤輸入。" };
    render();
  };
  try { recognition.start(); }
  catch (err) {
    state.feedback = { kind: "bad", text: "麥克風未能啟動，請直接鍵盤輸入。" };
    render();
    return;
  }
  if (box) box.focus();
}

function findTurn(id) {
  for (const run of RUNS) {
    for (const turn of run.turns) {
      if (turn.variants) {
        const variant = turn.variants.find((item) => item.id === id);
        if (variant) return variant;
      } else if (turn.id === id) return turn;
    }
  }
  return null;
}

function shortLabel(id) {
  const turn = findTurn(id);
  const text = turn ? (turn.model || turn.examiner || id) : id;
  return text.length > 24 ? text.slice(0, 24) + "…" : text;
}

/* 110 BPM 節拍器（QCPR 按壓節奏訓練） */
function toggleMetro() {
  const lbl = document.querySelector("#metro-label");
  const btn = document.querySelector("#metro");
  if (metroTimer) {
    clearInterval(metroTimer);
    metroTimer = null;
    if (lbl) lbl.hidden = true;
    if (btn) btn.textContent = "⏱️ 110 節拍器";
    return;
  }
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audioCtx) audioCtx = new AudioContext();
  const intervalMs = Math.round(60000 / 110);
  if (lbl) lbl.hidden = false;
  if (btn) btn.textContent = "⏹️ 停止節拍器";
  metroTimer = setInterval(() => {
    try {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) { }
  }, intervalMs);
}

document.querySelector("#metro").addEventListener("click", toggleMetro);

    }

});
